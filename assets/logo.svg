<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Window Tiling Control logo">
  <defs>
    <linearGradient id="wtcBg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3584E4"/>
      <stop offset="1" stop-color="#1C5FB4"/>
    </linearGradient>
    <linearGradient id="wtcTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
  </defs>

  <!-- rounded app-icon background -->
  <rect x="6" y="6" width="168" height="168" rx="40" fill="url(#wtcBg)"/>
  <rect x="6.5" y="6.5" width="167" height="167" rx="39.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>

  <!-- tiling layout: one left half + two right quarters (the "half + quarters" preset) -->
  <g fill="url(#wtcTile)">
    <rect x="40"  y="40"  width="46" height="100" rx="9"/>
    <rect x="96"  y="40"  width="44" height="46"  rx="9"/>
    <rect x="96"  y="94"  width="44" height="46"  rx="9"/>
  </g>

  <!-- accent title-bar on the active (left) tile -->
  <rect x="40" y="40" width="46" height="14" rx="7" fill="#3584E4" fill-opacity="0.20"/>
</svg>
